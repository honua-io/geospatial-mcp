name: MCP Protocol Certification

on:
  pull_request:
    branches: [trunk]
    paths:
      - "certification/**"
      - "conformance/**"
      - "spec/**"
      - ".github/workflows/protocol-certification.yml"
  push:
    branches: [trunk]
    paths:
      - "certification/**"
      - "conformance/**"
      - "spec/**"
      - ".github/workflows/protocol-certification.yml"
  schedule:
    - cron: "15 16 * * *"
  workflow_dispatch:
    inputs:
      tier:
        type: choice
        options: [release, nightly, pr]
        default: release
        required: true
      server_image:
        description: Immutable Honua candidate image (required for release)
        required: false
      server_source_sha:
        description: Full source SHA that produced the candidate image
        required: false
      server_seed_ref:
        description: Exact honua-server seed revision
        required: false
      release_cut:
        description: Independently frozen RFC 3339 release cut
        required: false

env:
  NODE_VERSION: "22.19.0"
  MCP_SDK_VERSION: "1.32.1"
  MCP_INSPECTOR_VERSION: "2.10.1"
  # Content-addressed corpus pins: git tree hashes of conformance/ and spec/.
  # A change to either directory must update these in the same PR
  # (certification/test/corpus-trees.test.mjs recomputes them).
  CONFORMANCE_CORPUS_TREE: "80d6f93e4bf85519aa014ccf2a9357faf0378d68"
  SPEC_TREE: "909c19a94d735eacc840eb7f40d1ce266e2ac551"
  PINNED_SERVER_IMAGE: "ghcr.io/honua-io/honua-server@sha256:62e312a8210ddf632ec5b903a2759327321966f72cbb9f75c0b2a3d2c1243458"
  PINNED_SERVER_SOURCE_SHA: "3ecd214c1ce20e96ad4911b6f8447055dee9089d"

permissions:
  attestations: read
  contents: read
  packages: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgis/postgis:16-3.4@sha256:44126d872ac91993766c341e369c539e8196614321765d36a6f1bab0419a5fa5
        env:
          POSTGRES_USER: honua
          POSTGRES_PASSWORD: honua
          POSTGRES_DB: honua_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Resolve tier and exact candidate identity
        id: identity
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TIER: ${{ inputs.tier }}
          INPUT_IMAGE: ${{ inputs.server_image }}
          INPUT_SOURCE_SHA: ${{ inputs.server_source_sha }}
          INPUT_SEED_REF: ${{ inputs.server_seed_ref }}
          INPUT_RELEASE_CUT: ${{ inputs.release_cut }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          tier="${INPUT_TIER:-pr}"
          [[ "${EVENT_NAME}" == schedule ]] && tier=nightly
          [[ "${EVENT_NAME}" == pull_request || "${EVENT_NAME}" == push ]] && tier=pr
          image="${INPUT_IMAGE:-${PINNED_SERVER_IMAGE}}"
          source_sha="${INPUT_SOURCE_SHA:-${PINNED_SERVER_SOURCE_SHA}}"
          seed_ref="${INPUT_SEED_REF:-${source_sha}}"
          release_cut="${INPUT_RELEASE_CUT:-}"
          if [[ "${tier}" == release ]]; then
            [[ -n "${INPUT_IMAGE}" && -n "${INPUT_SOURCE_SHA}" && -n "${release_cut}" ]] || { echo '::error::Release image, source SHA, and cut are required.'; exit 1; }
            [[ "${seed_ref}" == "${source_sha}" ]] || { echo '::error::Release seed must equal candidate source SHA.'; exit 1; }
          fi
          metadata="$(docker buildx imagetools inspect "${image}" --format '{{json .}}')"
          resolved="$(jq -er '.manifest.digest' <<< "${metadata}")"
          [[ "${image##*@}" == "${resolved}" && "${image}" =~ @sha256:[0-9a-f]{64}$ ]] || { echo '::error::Image is not bound to its resolved digest.'; exit 1; }
          [[ "${source_sha}" =~ ^[0-9a-f]{40}$ ]] || { echo '::error::Source SHA must be a full lowercase commit.'; exit 1; }
          created="$(jq -er '.image["linux/amd64"].created // .image.created // .image["linux/amd64"].config.created // .image.config.created' <<< "${metadata}")"
          echo "${GH_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin >/dev/null
          gh attestation verify "oci://${image}" --repo honua-io/honua-server --source-digest "${source_sha}" --deny-self-hosted-runners --format json > server-attestation.json
          {
            echo "tier=${tier}"
            echo "image=${image}"
            echo "source-sha=${source_sha}"
            echo "seed-ref=${seed_ref}"
            echo "cut-at=${release_cut:-${created}}"
            echo "started-at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "${GITHUB_OUTPUT}"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: certification/package-lock.json

      - name: Verify pinned clients and corpus
        run: |
          npm ci --ignore-scripts
          test "$(node -p "require('./node_modules/@modelcontextprotocol/sdk/package.json').version")" = "${MCP_SDK_VERSION}"
          test "$(node -p "require('./node_modules/@modelcontextprotocol/inspector/package.json').version")" = "${MCP_INSPECTOR_VERSION}"
          # content-addressed corpus check: no fetch, no dependency on a reachable commit
          actual_conformance="$(git rev-parse HEAD:conformance)"
          actual_spec="$(git rev-parse HEAD:spec)"
          [[ "${actual_conformance}" == "${CONFORMANCE_CORPUS_TREE}" ]] || { echo "::error::conformance/ tree ${actual_conformance} != pinned CONFORMANCE_CORPUS_TREE ${CONFORMANCE_CORPUS_TREE}"; exit 1; }
          [[ "${actual_spec}" == "${SPEC_TREE}" ]] || { echo "::error::spec/ tree ${actual_spec} != pinned SPEC_TREE ${SPEC_TREE}"; exit 1; }
        working-directory: certification

      - name: Check MCP tool roster parity against the server source SHA
        id: roster
        env:
          SERVER_SOURCE_SHA: ${{ steps.identity.outputs.source-sha }}
        shell: bash
        run: |
          set -euo pipefail
          url="https://raw.githubusercontent.com/honua-io/honua-server/${SERVER_SOURCE_SHA}/docs/gis/data/mcp-tool-roster.v1.json"
          mkdir -p .certification
          code="$(curl -sS -o .certification/mcp-tool-roster.v1.json -w '%{http_code}' "${url}")"
          if [[ "${code}" == 404 ]]; then
            # The roster artifact lands server-side separately; never treat its absence as parity.
            node certification/check-roster-parity.mjs spec/schemas/index.json - --absent > .certification/roster-parity.json || rc=$?
            [[ "${rc:-0}" == 3 ]] || { echo '::error::Roster parity checker did not report blocked for an absent roster.'; exit 1; }
            echo "::warning title=MCP roster parity blocked::blocked: roster not published at pinned sha ${SERVER_SOURCE_SHA}"
            echo "status=blocked" >> "${GITHUB_OUTPUT}"
            { echo '### MCP tool roster parity'; echo; echo "**blocked: roster not published at pinned sha** \`${SERVER_SOURCE_SHA}\`"; } >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi
          [[ "${code}" == 200 ]] || { echo "::error::Fetching the MCP tool roster returned HTTP ${code}."; exit 1; }
          rc=0
          node certification/check-roster-parity.mjs spec/schemas/index.json .certification/mcp-tool-roster.v1.json > .certification/roster-parity.json || rc=$?
          cat .certification/roster-parity.json
          status="$(jq -r .status .certification/roster-parity.json)"
          echo "status=${status}" >> "${GITHUB_OUTPUT}"
          { echo '### MCP tool roster parity'; echo; echo "**${status}** at \`${SERVER_SOURCE_SHA}\`"; echo; echo '```json'; cat .certification/roster-parity.json; echo '```'; } >> "${GITHUB_STEP_SUMMARY}"
          [[ "${rc}" == 0 && "${status}" == pass ]] || { echo '::error::Implemented index tools are missing from the server roster (static ∪ projectedAdmin).'; exit 1; }

      - name: Fetch exact seed and provision the database
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SEED_REF: ${{ steps.identity.outputs.seed-ref }}
          PGPASSWORD: honua
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .certification
          gh api "repos/honua-io/honua-server/contents/tests/seed/base-schema.sql?ref=${SEED_REF}" -H "Accept: application/vnd.github.raw" > .certification/base-schema.sql
          psql -h localhost -U honua -d honua_test -v ON_ERROR_STOP=1             -c "CREATE EXTENSION IF NOT EXISTS postgis; CREATE EXTENSION IF NOT EXISTS postgis_raster;"
          # A Production server refuses credential literals that ship in honua-server's harness
          # files (including the `honua` database password), so rotate the service role to a
          # per-run secret before the candidate connects.
          db_password="$(openssl rand -hex 24)"
          echo "::add-mask::${db_password}"
          psql -h localhost -U honua -d honua_test -v ON_ERROR_STOP=1 -c "ALTER ROLE honua PASSWORD '${db_password}'"
          echo "HONUA_CERT_DB_PASSWORD=${db_password}" >> "${GITHUB_ENV}"

      - name: Start exact Honua server image
        env:
          SERVER_IMAGE: ${{ steps.identity.outputs.image }}
        shell: bash
        run: |
          set -euo pipefail
          key="$(head -c 32 /dev/urandom | base64)"
          salt="$(head -c 16 /dev/urandom | base64)"
          # Boot against the extension-only database so the server's own migrations own the
          # schema; the seed is applied afterwards (as honua-server's setup-honua-server does).
          docker run -d --name honua-server --network host             -e ASPNETCORE_ENVIRONMENT=Production             -e ConnectionStrings__DefaultConnection="Host=localhost;Database=honua_test;Username=honua;Password=${HONUA_CERT_DB_PASSWORD}"             -e Security__ConnectionEncryption__MasterKey="${key}"             -e Security__ConnectionEncryption__Salt="${salt}"             -e HONUA_ADMIN_PASSWORD="Ci-Protocol-Api-Key-2026!"             -e Kestrel__Endpoints__Http__Url="http://+:8080"             -e Kestrel__Endpoints__Http__Protocols="Http1"             "${SERVER_IMAGE}"
          for i in $(seq 1 60); do
            [[ "$(curl -s --max-time 5 -o /dev/null -w '%{http_code}' http://localhost:8080/healthz/ready || true)" == 200 ]] && exit 0
            if [[ "$(docker inspect -f '{{.State.Running}}' honua-server 2>/dev/null || true)" != true ]]; then
              echo '::error::Honua server container exited before becoming ready.'
              break
            fi
            sleep 3
          done
          docker logs honua-server || true
          exit 1

      - name: Apply exact seed after migrations
        shell: bash
        run: PGPASSWORD="${HONUA_CERT_DB_PASSWORD}" psql -h localhost -U honua -d honua_test -v ON_ERROR_STOP=1 -f .certification/base-schema.sql

      - name: Exercise MCP through the real official SDK
        id: sdk
        continue-on-error: true
        working-directory: certification
        env:
          HONUA_MCP_URL: http://localhost:8080/mcp
          CERT_RESULTS: artifacts/sdk-results.json
        run: mkdir -p artifacts && node run-sdk.mjs

      - name: Exercise MCP through the real Inspector
        id: inspector
        continue-on-error: true
        working-directory: certification
        env:
          HONUA_MCP_URL: http://localhost:8080/mcp
          CERT_RESULTS: artifacts/inspector-results.json
        run: node run-inspector.mjs

      - name: Emit normalized digest-bound fragment
        if: always()
        env:
          SERVER_SOURCE_SHA: ${{ steps.identity.outputs.source-sha }}
          SERVER_IMAGE: ${{ steps.identity.outputs.image }}
          CUT_AT: ${{ steps.identity.outputs.cut-at }}
          STARTED_AT: ${{ steps.identity.outputs.started-at }}
          RUNTIME_ENVIRONMENT: Production
        shell: bash
        run: |
          mkdir -p artifacts/mcp
          jq -n \
            --arg sourceSha "${SERVER_SOURCE_SHA}" \
            --arg producerSourceSha "${GITHUB_SHA}" \
            --arg imageDigest "${SERVER_IMAGE##*@}" \
            --arg cutAt "${CUT_AT}" \
            --arg startedAt "${STARTED_AT}" \
            --arg runtimeEnvironment "${RUNTIME_ENVIRONMENT}" \
            --arg requestUrl "http://localhost:8080/mcp" \
            --slurpfile sdk certification/artifacts/sdk-results.json \
            --slurpfile inspector certification/artifacts/inspector-results.json \
            '{identity:{sourceSha:$sourceSha,producerSourceSha:$producerSourceSha,imageDigest:$imageDigest,cutAt:$cutAt,startedAt:$startedAt,runtimeEnvironment:$runtimeEnvironment,requestUrl:$requestUrl},results:{sdk:$sdk[0],inspector:$inspector[0]}}' \
            > artifacts/mcp/builder-input.json
          node certification/build-fragment.mjs artifacts/mcp/builder-input.json artifacts/mcp/protocol-certification-fragment.json

      - name: Upload governed producer artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mcp-protocol-certification-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/mcp/protocol-certification-fragment.json
          if-no-files-found: error
          retention-days: 90

      - name: Enforce MCP certification failure semantics
        if: always()
        run: |
          if [[ "${{ steps.sdk.outcome }}" == "failure" || "${{ steps.inspector.outcome }}" == "failure" ]]; then
            echo "MCP certification runner step(s) failed; downstream workflows must not pass this lane as green."
            exit 1
          fi
