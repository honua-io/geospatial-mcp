name: MCP Producer Source Controls

on:
  pull_request:
    paths:
      - certification/**
      - .github/workflows/mcp-producer-source-controls.yml
      - .github/requirements/mcp-ops.lock
  push:
    branches: [trunk]
    paths:
      - certification/**
      - .github/workflows/mcp-producer-source-controls.yml
      - .github/requirements/mcp-ops.lock
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: certification
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install exact configuration parser dependency
        working-directory: ${{ github.workspace }}
        run: |
          python3 -m pip install --require-hashes --only-binary=:all: -r .github/requirements/mcp-ops.lock
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.19.0"
          cache: npm
          cache-dependency-path: certification/package-lock.json
      - name: Install exact named clients for offline source controls
        run: npm ci --ignore-scripts
      - name: Fetch protected immutable oracle dependencies
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm run prepare:plan
          npm run prepare:render
          npm run prepare:app
          python3 generate-offline-app-vector.py
          npm run prepare:location
          npm run prepare:planning
          npm run prepare:deployment-workspace
          npm run prepare:ops-health
          npm run prepare:ops-events
          npm run prepare:grounding-status
          python3 fetch-certification-requirements.py --destination ../.certification
          python3 fetch-ops-events-manifest.py --governance-binding ../.certification/source-binding.json --destination artifacts
      - name: Generate protected-source offline location oracle vectors
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 generate-offline-location-vector.py
      - name: Generate protected-source offline Ops health oracle vector
        working-directory: certification
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 generate-offline-ops-health-vector.py
      - name: Generate protected-source offline findings and event oracle vectors
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 generate-offline-ops-events-vector.py
      - name: Generate protected-source offline grounding and status vectors
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 generate-offline-grounding-status-vector.py
      - name: Generate protected-source offline planning oracle vectors
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 generate-offline-planning-vector.py
      - name: Generate protected-source offline complete deployment workspace vectors
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 generate-offline-deployment-workspace-vector.py
      - name: Fetch reviewed receipt checker for schema integrity controls only
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import importlib.util, json
          from pathlib import Path
          spec = importlib.util.spec_from_file_location("governance", "fetch-certification-requirements.py")
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          pins = json.loads(Path("requirements-pins.json").read_bytes())
          path = "tools/check_protocol_certification.py"
          if pins["repository"] != module.REPOSITORY:
              raise ValueError("source checker repository differs")
          data, digest, _ = module.immutable_files(module.REPOSITORY, pins["sourceSha"], (path,))[path]
          if digest != pins["sha256"][path]:
              raise ValueError("source checker bytes differ from existing reviewed pins")
          target = Path(".source-controls/check_protocol_certification.py")
          target.parent.mkdir(exist_ok=True)
          target.write_bytes(data)
          PY
          echo "HONUA_RELEASE_CHECKER=${GITHUB_WORKSPACE}/certification/.source-controls/check_protocol_certification.py" >> "${GITHUB_ENV}"
      - name: Verify complete source controls without candidate admission
        run: |
          python3 -m unittest discover -s test -p 'test_fetch*.py' -v
          npm test
      - name: Retain source-only control provenance
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mcp-producer-source-controls-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            certification/.plan-validation/source-binding.json
            certification/.render-validation/source-binding.json
            certification/.location-validation/source-binding.json
            certification/location-validation-pins.json
            certification/.deployment-workspace-validation/source-binding.json
            certification/deployment-workspace-validation-pins.json
            certification/test/fixtures/offline-deployment-workspace-oracle-vector.json
            certification/.planning-validation/source-binding.json
            certification/planning-validation-pins.json
            certification/test/fixtures/offline-planning-oracle-vector.json
            certification/.ops-health-validation/source-binding.json
            certification/ops-health-validation-pins.json
            certification/.ops-events-validation/source-binding.json
            certification/ops-events-validation-pins.json
            certification/.grounding-status-validation/source-binding.json
            certification/grounding-status-validation-pins.json
            certification/artifacts/ops-events-platform-manifest.yaml
            certification/artifacts/ops-events-manifest-binding.json
            certification/test/fixtures/offline-location-oracle-vector.json
            certification/test/fixtures/offline-ops-health-oracle-vector.json
            certification/test/fixtures/offline-ops-events-oracle-vector.json
            certification/test/fixtures/offline-grounding-status-oracle-vector.json
            certification/.app-validation/source-binding.json
            certification/app-validation-pins.json
            certification/test/fixtures/offline-app-oracle-vector.json
            certification/.source-controls/check_protocol_certification.py
            certification/requirements-pins.json
            certification/test/fixtures/historical-execute-plan-39284007212.json
          if-no-files-found: warn
          retention-days: 90
