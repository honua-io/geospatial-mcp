name: docs

on:
  push:
    branches: [trunk]
  pull_request:

permissions:
  contents: read

jobs:
  markdownlint:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run markdownlint-cli2
        uses: DavidAnson/markdownlint-cli2-action@v23
        with:
          globs: "**/*.md"

  relative-links:
    name: Relative link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Verify internal relative links and #anchor fragments resolve
        run: python3 tools/check_links.py

  conformance:
    name: Conformance checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Install validation dependencies
        run: python3 -m pip install -r conformance/requirements.txt
      - name: Validate fixtures against published schemas
        run: python3 conformance/fixtures/validate.py --strict
      - name: Check reference manifest conformance
        # The reference manifest is generated from the live honua-server /mcp
        # surface by scripts/conformance/mcp/manifest-gen in honua-server
        # (CapabilityManifestEmitter); --strict scores it at FULL against the
        # published index.json vocabulary and validates it against
        # manifest.schema.json.
        run: python3 conformance/check_manifest.py --strict conformance/manifests/honua.manifest.json
      - name: Run conformance checker regression tests
        run: python3 conformance/test_check_manifest.py
      - name: Validate portable agent skills
        run: python3 tools/validate_skills.py
      - name: Run skills validator regression tests
        run: python3 -m unittest tools.test_validate_skills
