name: MCP Protocol Certification
run-name: ${{ inputs.nightly_dispatch_id && format('MCP Protocol Certification [{0}]', inputs.nightly_dispatch_id) || 'MCP Protocol Certification' }}

on:
  pull_request:
    branches: [trunk]
    paths:
      - "certification/**"
      - "conformance/**"
      - "spec/**"
      - ".github/workflows/protocol-certification.yml"
      - .github/requirements/mcp-ops.lock
  push:
    branches: [trunk]
    paths:
      - "certification/**"
      - "conformance/**"
      - "spec/**"
      - ".github/workflows/protocol-certification.yml"
      - .github/requirements/mcp-ops.lock
  schedule:
    - cron: "15 16 * * *"
  workflow_dispatch:
    inputs:
      tier:
        type: choice
        options: [release, nightly, pr]
        default: release
        required: true
      server_image:
        description: Immutable Honua candidate image (required for release)
        required: false
      server_source_sha:
        description: Full source SHA that produced the candidate image
        required: false
      server_seed_ref:
        description: Exact honua-server seed revision
        required: false
      requirements_ref:
        description: Full honua-release commit owning the governed requirement catalog
        required: false
      requirements_revision:
        description: Exact governed catalog revision (required for release)
        required: false
      deployment_target_id:
        description: Actual owned target with independently observed succeeded deployment history
        required: false
      release_cut:
        description: Independently frozen RFC 3339 release cut
        required: false
      nightly_dispatch_id:
        description: Nightly orchestrator correlation ID (nightly-certification-<run>-<attempt>), recorded in each executed evidence receipt
        required: false
        type: string

env:
  NODE_VERSION: "22.19.0"
  MCP_SDK_VERSION: "1.32.1"
  MCP_INSPECTOR_VERSION: "2.10.1"
  # Content-addressed corpus pins: git tree hashes of conformance/ and spec/.
  # A change to either directory must update these in the same PR
  # (certification/test/corpus-trees.test.mjs recomputes them).
  CONFORMANCE_CORPUS_TREE: "80d6f93e4bf85519aa014ccf2a9357faf0378d68"
  SPEC_TREE: "909c19a94d735eacc840eb7f40d1ce266e2ac551"
  PINNED_SERVER_IMAGE: "ghcr.io/honua-io/honua-server@sha256:c8d7aef98761618145725530b6a4e4b25ea4a9ae121da168362f9be4cf5f7d37"
  PINNED_SERVER_SOURCE_SHA: "a4bde4b8c5ee8cc3dec05ad8b3d4f84470c1ea6e"

permissions:
  attestations: read
  contents: read
  packages: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        # honua-server's location fixture (tests/seed/sdk-protocol-v1) routes over pgRouting; the
        # same digest the release pins for customer installs (customer-install-manifest.json).
        image: pgrouting/pgrouting:17-3.5-3.7.3@sha256:5e6767abbd1fd9ead84c9988aa31bac71ca292ef8a1fc2e4a5ee2b613ac6a7bb
        env:
          POSTGRES_USER: honua
          POSTGRES_PASSWORD: honua
          POSTGRES_DB: honua_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Resolve tier and exact candidate identity
        id: identity
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TIER: ${{ inputs.tier }}
          INPUT_IMAGE: ${{ inputs.server_image }}
          INPUT_SOURCE_SHA: ${{ inputs.server_source_sha }}
          INPUT_SEED_REF: ${{ inputs.server_seed_ref }}
          INPUT_RELEASE_CUT: ${{ inputs.release_cut }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          tier="${INPUT_TIER:-pr}"
          [[ "${EVENT_NAME}" == schedule ]] && tier=nightly
          [[ "${EVENT_NAME}" == pull_request || "${EVENT_NAME}" == push ]] && tier=pr
          image="${INPUT_IMAGE:-${PINNED_SERVER_IMAGE}}"
          source_sha="${INPUT_SOURCE_SHA:-${PINNED_SERVER_SOURCE_SHA}}"
          seed_ref="${INPUT_SEED_REF:-${source_sha}}"
          release_cut="${INPUT_RELEASE_CUT:-}"
          if [[ "${tier}" == release ]]; then
            [[ -n "${INPUT_IMAGE}" && -n "${INPUT_SOURCE_SHA}" && -n "${release_cut}" ]] || { echo '::error::Release image, source SHA, and cut are required.'; exit 1; }
            [[ "${seed_ref}" == "${source_sha}" ]] || { echo '::error::Release seed must equal candidate source SHA.'; exit 1; }
          fi
          metadata="$(docker buildx imagetools inspect "${image}" --format '{{json .}}')"
          resolved="$(jq -er '.manifest.digest' <<< "${metadata}")"
          [[ "${image##*@}" == "${resolved}" && "${image}" =~ @sha256:[0-9a-f]{64}$ ]] || { echo '::error::Image is not bound to its resolved digest.'; exit 1; }
          [[ "${source_sha}" =~ ^[0-9a-f]{40}$ ]] || { echo '::error::Source SHA must be a full lowercase commit.'; exit 1; }
          created="$(jq -er '.image["linux/amd64"].created // .image.created // .image["linux/amd64"].config.created // .image.config.created' <<< "${metadata}")"
          echo "${GH_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin >/dev/null
          gh attestation verify "oci://${image}" --repo honua-io/honua-server --source-digest "${source_sha}" --deny-self-hosted-runners --format json > server-attestation.json
          {
            echo "tier=${tier}"
            echo "image=${image}"
            echo "source-sha=${source_sha}"
            echo "seed-ref=${seed_ref}"
            echo "cut-at=${release_cut:-${created}}"
            echo "started-at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "${GITHUB_OUTPUT}"

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install exact configuration parser dependency
        working-directory: ${{ github.workspace }}
        run: |
          python3 -m pip install --require-hashes --only-binary=:all: -r .github/requirements/mcp-ops.lock
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: certification/package-lock.json

      - name: Fetch protected-history governed requirement context and consumer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUIREMENTS_REF: ${{ inputs.requirements_ref }}
          REQUIREMENTS_REVISION: ${{ inputs.requirements_revision }}
          TIER: ${{ steps.identity.outputs.tier }}
        shell: bash
        run: |
          set -euo pipefail
          args=(--destination .certification)
          if [[ -n "${REQUIREMENTS_REF}" || -n "${REQUIREMENTS_REVISION}" ]]; then
            [[ -n "${REQUIREMENTS_REF}" && -n "${REQUIREMENTS_REVISION}" ]] || { echo '::error::Governed source/revision must be supplied together.'; exit 1; }
            args+=(--source-sha "${REQUIREMENTS_REF}" --requirements-revision "${REQUIREMENTS_REVISION}")
          fi
          [[ "${TIER}" != release || -n "${REQUIREMENTS_REF}" && -n "${REQUIREMENTS_REVISION}" ]] || { echo '::error::Release requirements source/revision are required.'; exit 1; }
          python3 certification/fetch-certification-requirements.py "${args[@]}"
          echo "HONUA_RELEASE_CHECKER=${GITHUB_WORKSPACE}/.certification/check_protocol_certification.py" >> "${GITHUB_ENV}"

      - name: Fetch immutable protected shared plan scenario
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: certification
        run: npm run prepare:plan

      - name: Fetch immutable protected complete render package ingest and style source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HONUA_MCP_SERVER_SOURCE_SHA: ${{ steps.identity.outputs.source-sha }}
          HONUA_MCP_SERVER_IMAGE: ${{ steps.identity.outputs.image }}
        working-directory: certification
        run: |
          npm run prepare:render
          npm run prepare:historical-render
          npm run prepare:location
          npm run prepare:planning
          npm run prepare:direct-cancel
          npm run prepare:deployment-workspace
          npm run prepare:ops-health
          npm run prepare:ops-events
          npm run prepare:grounding-status
          python3 fetch-ops-events-manifest.py --governance-binding ../.certification/source-binding.json --destination artifacts --candidate-source-sha "${HONUA_MCP_SERVER_SOURCE_SHA}" --candidate-image "${HONUA_MCP_SERVER_IMAGE}"

      - name: Fetch immutable protected separate app workflow and oracle bundle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: certification
        run: npm run prepare:app

      - name: Generate protected-source offline oracle controls
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: certification
        run: |
          python3 generate-offline-app-vector.py
          python3 generate-offline-location-vector.py
          python3 generate-offline-planning-vector.py
          python3 generate-offline-direct-cancel-vector.py
          python3 generate-offline-deployment-workspace-vector.py
          python3 generate-offline-ops-health-vector.py
          python3 generate-offline-ops-events-vector.py
          python3 generate-offline-grounding-status-vector.py

      - name: Verify pinned clients and corpus
        run: |
          npm ci --ignore-scripts
          python3 -m unittest discover -s test -p 'test_fetch*.py' -v
          npm test
          test "$(node -p "require('./node_modules/@modelcontextprotocol/sdk/package.json').version")" = "${MCP_SDK_VERSION}"
          test "$(node -p "require('./node_modules/@modelcontextprotocol/inspector/package.json').version")" = "${MCP_INSPECTOR_VERSION}"
          # content-addressed corpus check: no fetch, no dependency on a reachable commit
          actual_conformance="$(git rev-parse HEAD:conformance)"
          actual_spec="$(git rev-parse HEAD:spec)"
          [[ "${actual_conformance}" == "${CONFORMANCE_CORPUS_TREE}" ]] || { echo "::error::conformance/ tree ${actual_conformance} != pinned CONFORMANCE_CORPUS_TREE ${CONFORMANCE_CORPUS_TREE}"; exit 1; }
          [[ "${actual_spec}" == "${SPEC_TREE}" ]] || { echo "::error::spec/ tree ${actual_spec} != pinned SPEC_TREE ${SPEC_TREE}"; exit 1; }
        working-directory: certification

      - name: Fetch server-owned cancellation harness at the exact candidate source
        id: cancellation-harness
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SERVER_SOURCE_SHA: ${{ steps.identity.outputs.source-sha }}
        run: |
          python3 certification/fetch-server-harness.py --source-sha "${SERVER_SOURCE_SHA}" --destination certification/.candidate-server
          mkdir -p certification/artifacts
          cp certification/.candidate-server/source-binding.json certification/artifacts/server-harness-source-binding.json

      - name: Verify server-owned installed-client and PostGIS observer controls
        if: steps.cancellation-harness.outcome == 'success'
        working-directory: certification
        run: |
          ln -s "${GITHUB_WORKSPACE}/certification/node_modules" .candidate-server/node_modules
          mkdir -p artifacts/inspector-browser-controls
          npm ci --ignore-scripts --prefix .candidate-server/browser
          .candidate-server/browser/node_modules/.bin/playwright install --with-deps chromium
          node --test .candidate-server/test/*.test.mjs
          node --test .candidate-server/inspector-pagination.test.mjs
          node --test .candidate-server/inspector-browser-wire.test.mjs
          # Harness-only SQL cancellation; never a candidate certification row.
          HONUA_MCP_OBSERVER_PGHOST=127.0.0.1 HONUA_MCP_OBSERVER_PGPORT=5432 \
            HONUA_MCP_OBSERVER_PGUSER=honua HONUA_MCP_OBSERVER_PGPASSWORD=honua \
            HONUA_MCP_OBSERVER_PGSERVER_APP_NAME=honua-observer-control \
            node --test .candidate-server/test/postgres-observer.integration.mjs
          HONUA_MCP_OBSERVER_PGHOST=127.0.0.1 HONUA_MCP_OBSERVER_PGPORT=5432 \
            HONUA_MCP_OBSERVER_PGUSER=honua HONUA_MCP_OBSERVER_PGPASSWORD=honua \
            HONUA_MCP_OBSERVER_PGSERVER_APP_NAME=honua-inspector-control \
            node --test .candidate-server/inspector-browser-cancellation.integration.mjs

      - name: Check MCP tool roster parity against the server source SHA
        id: roster
        env:
          SERVER_SOURCE_SHA: ${{ steps.identity.outputs.source-sha }}
        shell: bash
        run: |
          set -euo pipefail
          url="https://raw.githubusercontent.com/honua-io/honua-server/${SERVER_SOURCE_SHA}/docs/gis/data/mcp-tool-roster.v1.json"
          mkdir -p .certification
          code="$(curl -sS -o .certification/mcp-tool-roster.v1.json -w '%{http_code}' "${url}")"
          if [[ "${code}" == 404 ]]; then
            # The roster artifact lands server-side separately; never treat its absence as parity.
            node certification/check-roster-parity.mjs spec/schemas/index.json - --absent > .certification/roster-parity.json || rc=$?
            [[ "${rc:-0}" == 3 ]] || { echo '::error::Roster parity checker did not report blocked for an absent roster.'; exit 1; }
            echo "::warning title=MCP roster parity blocked::blocked: roster not published at pinned sha ${SERVER_SOURCE_SHA}"
            echo "status=blocked" >> "${GITHUB_OUTPUT}"
            { echo '### MCP tool roster parity'; echo; echo "**blocked: roster not published at pinned sha** \`${SERVER_SOURCE_SHA}\`"; } >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi
          [[ "${code}" == 200 ]] || { echo "::error::Fetching the MCP tool roster returned HTTP ${code}."; exit 1; }
          rc=0
          node certification/check-roster-parity.mjs spec/schemas/index.json .certification/mcp-tool-roster.v1.json > .certification/roster-parity.json || rc=$?
          cat .certification/roster-parity.json
          status="$(jq -r .status .certification/roster-parity.json)"
          echo "status=${status}" >> "${GITHUB_OUTPUT}"
          { echo '### MCP tool roster parity'; echo; echo "**${status}** at \`${SERVER_SOURCE_SHA}\`"; echo; echo '```json'; cat .certification/roster-parity.json; echo '```'; } >> "${GITHUB_STEP_SUMMARY}"
          [[ "${rc}" == 0 && "${status}" == pass ]] || { echo '::error::Implemented index tools are missing from the server roster (static ∪ projectedAdmin).'; exit 1; }

      - name: Fetch exact seed and provision the database
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SEED_REF: ${{ steps.identity.outputs.seed-ref }}
          PGPASSWORD: honua
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .certification
          gh api "repos/honua-io/honua-server/contents/tests/seed/base-schema.sql?ref=${SEED_REF}" -H "Accept: application/vnd.github.raw" > .certification/base-schema.sql
          psql -h localhost -U honua -d honua_test -v ON_ERROR_STOP=1             -c "CREATE EXTENSION IF NOT EXISTS postgis; CREATE EXTENSION IF NOT EXISTS postgis_raster;"
          # A Production server refuses credential literals that ship in honua-server's harness
          # files (including the `honua` database password), so rotate the service role to a
          # per-run secret before the candidate connects.
          db_password="$(openssl rand -hex 24)"
          echo "::add-mask::${db_password}"
          psql -h localhost -U honua -d honua_test -v ON_ERROR_STOP=1 -c "ALTER ROLE honua PASSWORD '${db_password}'"
          echo "HONUA_CERT_DB_PASSWORD=${db_password}" >> "${GITHUB_ENV}"

      - name: Fetch the candidate's location fixture sources
        id: location-fixture
        # A missing or drifted fixture fails certify (enforce step) but must not hide the
        # other journeys; geocoding stays fail-closed through the egress block regardless.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SEED_REF: ${{ steps.identity.outputs.seed-ref }}
        shell: bash
        run: |
          set -euo pipefail
          # The candidate's own seed/verify scripts check every manifest input by digest, so fetch
          # them byte-exact at the candidate source rather than vendoring a copy here.
          root=".certification/location-source"
          printf '%s\n' 'Geocoding__Providers__Nominatim__Enabled=false' > "${RUNNER_TEMP}/location.env"
          echo "HONUA_MCP_LOCATION_ENV_FILE=${RUNNER_TEMP}/location.env" >> "${GITHUB_ENV}"
          for path in \
            scripts/certification/seed-sdk-protocol-fixture.py \
            scripts/certification/verify-sdk-protocol-fixture.py \
            tests/seed/sdk-protocol-v1/manifest.json \
            tests/seed/sdk-protocol-v1/geocoder.csv \
            docker/routing/init-routing.sql \
            docs/gis/data/client-certification-fixture.v1.json \
            src/Honua.Server/appsettings.json \
            eng/Honua.ProtocolProfiles.props \
            src/Honua.Server/fixtures/scenes/downtown-honolulu/tileset.json \
            src/Honua.Server/fixtures/scenes/downtown-honolulu/tiles/0.b3dm \
            src/Honua.Server/fixtures/scenes/downtown-honolulu/metadata/scene.json; do
            mkdir -p "${root}/$(dirname "${path}")"
            gh api "repos/honua-io/honua-server/contents/${path}?ref=${SEED_REF}" -H "Accept: application/vnd.github.raw" > "${root}/${path}"
          done
          python3 "${root}/scripts/certification/verify-sdk-protocol-fixture.py" --server-env > .certification/location-server-config.json
          # Only the routing/geocoding keys; the candidate's other defaults are not changed.
          jq -er 'to_entries | map(select(.key | test("^(Routing|Geocoding)__"))) | if length < 5 then error("location fixture config missing") else . end
            | .[] | "\(.key)=\(.value)"' .certification/location-server-config.json >> "${RUNNER_TEMP}/location.env"
          # The candidate always registers Nominatim and its outbound-URL validator rejects a
          # non-public base URL, so egress is blocked at the network instead (next step).
          grep -qx 'Geocoding__DefaultProvider=local' "${RUNNER_TEMP}/location.env"
          grep -qx 'Geocoding__Providers__Local__Enabled=true' "${RUNNER_TEMP}/location.env"
          grep -qx 'Routing__Provider=pgrouting' "${RUNNER_TEMP}/location.env"

      - name: Block public geocoder egress before candidate boot
        shell: bash
        run: |
          set -euo pipefail
          # Certification must never send addresses to a public service. The candidate runs with
          # host networking, so rejecting these destinations in the runner's OUTPUT chain covers it.
          for host in nominatim.openstreetmap.org; do
            v4="$(getent ahostsv4 "${host}" | awk '{print $1}' | sort -u)"
            v6="$(getent ahostsv6 "${host}" | awk '$1 ~ /:/ {print $1}' | sort -u)"
            [[ -n "${v4}${v6}" ]] || { echo "::error::cannot resolve ${host} to block it"; exit 1; }
            for ip in ${v4}; do sudo iptables -I OUTPUT -d "${ip}" -j REJECT; done
            for ip in ${v6}; do sudo ip6tables -I OUTPUT -d "${ip}" -j REJECT; done
            if curl -sS --max-time 10 -o /dev/null "https://${host}/status.php" 2>/dev/null; then
              echo "::error::${host} is still reachable after the egress block"; exit 1
            fi
          done

      - name: Provision and verify durable Redis prerequisite
        shell: bash
        run: |
          set -euo pipefail
          image="redis:7.2-alpine@sha256:29e8589c3f9ba699b5f7aa4b3c7733c58852a3626439e619aa0ee78de08c6ca0"
          docker volume create honua-mcp-redis-data
          docker run -d --name honua-mcp-redis --network host \
            --mount source=honua-mcp-redis-data,target=/data "${image}" \
            redis-server --bind 127.0.0.1 --protected-mode yes --appendonly yes --appendfsync everysec --maxmemory-policy noeviction
          for attempt in $(seq 1 30); do
            [[ "$(docker exec honua-mcp-redis redis-cli --raw PING 2>/dev/null || true)" == PONG ]] && break
            sleep 1
          done
          [[ "$(docker exec honua-mcp-redis redis-cli --raw PING)" == PONG ]]
          appendonly="$(docker exec honua-mcp-redis redis-cli --raw CONFIG GET appendonly | tail -n 1)"
          appendfsync="$(docker exec honua-mcp-redis redis-cli --raw CONFIG GET appendfsync | tail -n 1)"
          eviction="$(docker exec honua-mcp-redis redis-cli --raw CONFIG GET maxmemory-policy | tail -n 1)"
          persistence="$(docker exec honua-mcp-redis redis-cli --raw INFO persistence | tr -d '\r')"
          [[ "${appendonly}" == yes && "${appendfsync}" == everysec && "${eviction}" == noeviction ]]
          [[ $'\n'"${persistence}"$'\n' == *$'\naof_enabled:1\n'* && $'\n'"${persistence}"$'\n' == *$'\naof_last_write_status:ok\n'* ]]
          mkdir -p certification/artifacts
          jq -n --arg image "${image}" --arg container "$(docker inspect -f '{{.Id}}' honua-mcp-redis)" \
            --arg imageId "$(docker inspect -f '{{.Image}}' honua-mcp-redis)" \
            --arg appendonly "${appendonly}" --arg appendfsync "${appendfsync}" --arg evictionPolicy "${eviction}" \
            --arg persistence "${persistence}" --arg observedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{schema:"honua.mcp-redis-prerequisite/v1",image:$image,container:$container,imageId:$imageId,appendonly:$appendonly,appendfsync:$appendfsync,evictionPolicy:$evictionPolicy,persistence:$persistence,observedAt:$observedAt,candidateQualified:false}' \
            > certification/artifacts/redis-durability.json

      - name: Derive declared skew and explicit owned authorization before candidate boot
        env:
          HONUA_MCP_SERVER_SOURCE_SHA: ${{ steps.identity.outputs.source-sha }}
          HONUA_MCP_SERVER_IMAGE: ${{ steps.identity.outputs.image }}
          HONUA_MCP_OPS_ENV_FILE: ${{ runner.temp }}/mcp-ops-declared-options.env
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import { writeFileSync } from "node:fs";
          import { prepareOpsEventsConfiguration } from "./certification/ops-events-validation.mjs";
          import { composeOwnedCandidateEnvironment } from "./certification/deployment-workspace-validation.mjs";
          const declared = prepareOpsEventsConfiguration();
          const composed = composeOwnedCandidateEnvironment(declared.environment);
          writeFileSync(process.env.HONUA_MCP_OPS_ENV_FILE, composed.lines.join("\n") + "\n", { mode: 0o600, flag: "wx" });
          writeFileSync("certification/artifacts/owned-authorization-declaration.json", JSON.stringify(composed.declaration, null, 2) + "\n");
          writeFileSync("certification/artifacts/ops-events-declaration.json", JSON.stringify(declared, null, 2) + "\n");
          JS
          echo "HONUA_MCP_OPS_ENV_FILE=${HONUA_MCP_OPS_ENV_FILE}" >> "${GITHUB_ENV}"

      - name: Start exact Honua server image
        env:
          SERVER_IMAGE: ${{ steps.identity.outputs.image }}
        shell: bash
        run: |
          set -euo pipefail
          key="$(head -c 32 /dev/urandom | base64)"
          salt="$(head -c 16 /dev/urandom | base64)"
          # Production durable operations encrypt their Redis-backed key ring with
          # a separately mounted operator certificate. Keep its private material
          # outside the workspace and every uploaded receipt.
          keyring_dir="${RUNNER_TEMP}/mcp-operation-keyring"
          mkdir -m 700 "${keyring_dir}"
          export HONUA_CERT_KEYRING_PASSWORD="$(openssl rand -hex 24)"
          echo "::add-mask::${HONUA_CERT_KEYRING_PASSWORD}"
          openssl req -x509 -newkey rsa:2048 -nodes -days 2 -subj "/CN=mcp-canonical-keyring" \
            -keyout "${keyring_dir}/private.key" -out "${keyring_dir}/certificate.crt" 2>/dev/null
          openssl pkcs12 -export -out "${keyring_dir}/operation-keyring.pfx" \
            -inkey "${keyring_dir}/private.key" -in "${keyring_dir}/certificate.crt" -passout env:HONUA_CERT_KEYRING_PASSWORD
          rm "${keyring_dir}/private.key" "${keyring_dir}/certificate.crt"
          chmod 444 "${keyring_dir}/operation-keyring.pfx"
          chmod 755 "${keyring_dir}"
          # Boot against the extension-only database so the server's own migrations own the
          # schema; the seed is applied afterwards (as honua-server's setup-honua-server does).
          docker run -d --name honua-server --network host             -e ASPNETCORE_ENVIRONMENT=Production             -e Licensing__Mode=Disabled             -e Operations__SecretChannel__KeyRingCertificatePath=/keyring/operation-keyring.pfx             -e Operations__SecretChannel__KeyRingCertificatePassword="${HONUA_CERT_KEYRING_PASSWORD}"             --mount "type=bind,source=${keyring_dir},target=/keyring,readonly"             -e ConnectionStrings__Redis="localhost:6379"             -e Jobs__RequireDurableStore=true             -e ConnectionStrings__DefaultConnection="Host=localhost;Database=honua_test;Username=honua;Password=${HONUA_CERT_DB_PASSWORD};Application Name=honua-mcp-cert-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"             -e Security__ConnectionEncryption__MasterKey="${key}"             -e Security__ConnectionEncryption__Salt="${salt}"             -e HONUA_ADMIN_PASSWORD="Ci-Protocol-Api-Key-2026!"             -e Kestrel__Endpoints__Http__Url="http://+:8080"             -e Kestrel__Endpoints__Http__Protocols="Http1"             --env-file "${HONUA_MCP_OPS_ENV_FILE}" --env-file "${HONUA_MCP_LOCATION_ENV_FILE}" "${SERVER_IMAGE}"
          for i in $(seq 1 60); do
            [[ "$(curl -s --max-time 5 -o /dev/null -w '%{http_code}' http://localhost:8080/healthz/ready || true)" == 200 ]] && exit 0
            if [[ "$(docker inspect -f '{{.State.Running}}' honua-server 2>/dev/null || true)" != true ]]; then
              echo '::error::Honua server container exited before becoming ready.'
              break
            fi
            sleep 3
          done
          docker logs honua-server || true
          exit 1

      - name: Verify observed deployment mode and durable job substrate
        env:
          HONUA_MCP_API_KEY: Ci-Protocol-Api-Key-2026!
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p certification/artifacts
          curl --fail --silent --show-error --max-time 20 --header "X-API-Key: ${HONUA_MCP_API_KEY}" \
            http://localhost:8080/api/v1/admin/license/status > "${RUNNER_TEMP}/mcp-license-status.json"
          curl --fail --silent --show-error --max-time 20 --header "X-API-Key: ${HONUA_MCP_API_KEY}" \
            http://localhost:8080/api/v1/capabilities/manifest > "${RUNNER_TEMP}/mcp-capability-manifest.json"
          jq -e '.data.mode == "disabled" and .data.isValid == true' "${RUNNER_TEMP}/mcp-license-status.json"
          jq -e '.limits.job.durableJobRuntimeAvailable == true and ([.capabilities[] | select(.id == "operations.proposals" and .available == true)] | length) == 1' \
            "${RUNNER_TEMP}/mcp-capability-manifest.json"
          jq -n --slurpfile license "${RUNNER_TEMP}/mcp-license-status.json" \
            --slurpfile capabilities "${RUNNER_TEMP}/mcp-capability-manifest.json" \
            '{schema:"honua.mcp-deployment-prerequisite/v1",mode:$license[0].data.mode,isValid:$license[0].data.isValid,durableJobRuntimeAvailable:$capabilities[0].limits.job.durableJobRuntimeAvailable,proposalCapabilities:[$capabilities[0].capabilities[] | select(.id == "operations.proposals")],candidateQualified:false}' \
            > certification/artifacts/deployment-prerequisites.json

      - name: Apply exact seed after migrations
        shell: bash
        run: PGPASSWORD="${HONUA_CERT_DB_PASSWORD}" psql -h localhost -U honua -d honua_test -v ON_ERROR_STOP=1 -f .certification/base-schema.sql

      - name: Seed and probe the candidate's local geocoder and pgRouting fixture
        id: location-seed
        if: steps.location-fixture.outcome == 'success'
        continue-on-error: true
        env:
          HONUA_PROTOCOL_FIXTURE_TARGET: ephemeral
          PGHOST: 127.0.0.1
          PGUSER: honua
          PGDATABASE: honua_test
          PGPASSWORD: ${{ env.HONUA_CERT_DB_PASSWORD }}
          HONUA_ADMIN_PASSWORD: Ci-Protocol-Api-Key-2026!
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p certification/artifacts
          python3 .certification/location-source/scripts/certification/seed-sdk-protocol-fixture.py --apply \
            --base-url http://localhost:8080 --receipt certification/artifacts/location-setup-receipt.json

      - name: Retain independently allocated authored point fixture IDs
        env:
          PGPASSWORD: ${{ env.HONUA_CERT_DB_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          psql -h localhost -U honua -d honua_test -v ON_ERROR_STOP=1 -At \
            -c "SELECT json_agg(row_to_json(f) ORDER BY f.name) FROM (SELECT objectid AS id, attributes->>'name' AS name FROM features WHERE layer_id=0 AND attributes->>'name' IN ('alpha','beta')) f" \
            > .certification/fixture-row-ids.json

      - name: Provision authored render fixture through verified release-owned bootstrap
        id: render-bootstrap
        continue-on-error: true
        env:
          HONUA_MCP_API_KEY: Ci-Protocol-Api-Key-2026!
          HONUA_CERT_DB_PASSWORD: ${{ env.HONUA_CERT_DB_PASSWORD }}
          HONUA_MCP_SERVER_SOURCE_SHA: ${{ steps.identity.outputs.source-sha }}
          HONUA_MCP_SERVER_IMAGE: ${{ steps.identity.outputs.image }}
        run: node --input-type=module -e 'import { bootstrapRender } from "./certification/render-validation.mjs"; bootstrapRender();'

      - name: Provision original durable event read fixture once for both clients
        id: ops-events-setup
        if: steps.render-bootstrap.outcome == 'success'
        continue-on-error: true
        env:
          HONUA_MCP_SERVER_SOURCE_SHA: ${{ steps.identity.outputs.source-sha }}
          HONUA_MCP_SERVER_IMAGE: ${{ steps.identity.outputs.image }}
          HONUA_MCP_OWNED_DISPOSABLE_CANDIDATE: "1"
          HONUA_CERT_DB_PASSWORD: ${{ env.HONUA_CERT_DB_PASSWORD }}
        run: node --input-type=module -e 'import { provisionOpsEvents } from "./certification/ops-events-validation.mjs"; provisionOpsEvents();'

      - name: Exercise MCP through the real official SDK
        id: sdk
        continue-on-error: true
        working-directory: certification
        env:
          HONUA_MCP_URL: http://localhost:8080/mcp
          CERT_RESULTS: artifacts/sdk-results.json
          HONUA_MCP_API_KEY: Ci-Protocol-Api-Key-2026!
          HONUA_MCP_SEED_SQL: ${{ github.workspace }}/.certification/base-schema.sql
          HONUA_MCP_FIXTURE_IDS: ${{ github.workspace }}/.certification/fixture-row-ids.json
          HONUA_MCP_SEED_SOURCE_SHA: ${{ steps.identity.outputs.seed-ref }}
          HONUA_MCP_SERVER_SOURCE_SHA: ${{ steps.identity.outputs.source-sha }}
          HONUA_MCP_SERVER_IMAGE: ${{ steps.identity.outputs.image }}
          HONUA_MCP_CANCELLATION_OBSERVER: postgres-lock-v1
          HONUA_MCP_OBSERVER_PGHOST: 127.0.0.1
          HONUA_MCP_OBSERVER_PGPORT: "5432"
          HONUA_MCP_OBSERVER_PGDATABASE: honua_test
          HONUA_MCP_OBSERVER_PGUSER: honua
          HONUA_MCP_OBSERVER_PGPASSWORD: ${{ env.HONUA_CERT_DB_PASSWORD }}
          HONUA_MCP_OBSERVER_PGSERVER_APP_NAME: honua-mcp-cert-${{ github.run_id }}-${{ github.run_attempt }}
        run: mkdir -p artifacts && node run-sdk.mjs

      - name: Exercise MCP through the real Inspector
        id: inspector
        continue-on-error: true
        working-directory: certification
        env:
          HONUA_MCP_URL: http://localhost:8080/mcp
          CERT_RESULTS: artifacts/inspector-results.json
          HONUA_MCP_API_KEY: Ci-Protocol-Api-Key-2026!
          HONUA_MCP_SEED_SQL: ${{ github.workspace }}/.certification/base-schema.sql
          HONUA_MCP_FIXTURE_IDS: ${{ github.workspace }}/.certification/fixture-row-ids.json
          HONUA_MCP_SEED_SOURCE_SHA: ${{ steps.identity.outputs.seed-ref }}
          HONUA_MCP_SERVER_SOURCE_SHA: ${{ steps.identity.outputs.source-sha }}
          HONUA_MCP_SERVER_IMAGE: ${{ steps.identity.outputs.image }}
          HONUA_MCP_CANCELLATION_OBSERVER: postgres-lock-v1
          HONUA_MCP_OBSERVER_PGHOST: 127.0.0.1
          HONUA_MCP_OBSERVER_PGPORT: "5432"
          HONUA_MCP_OBSERVER_PGDATABASE: honua_test
          HONUA_MCP_OBSERVER_PGUSER: honua
          HONUA_MCP_OBSERVER_PGPASSWORD: ${{ env.HONUA_CERT_DB_PASSWORD }}
          HONUA_MCP_OBSERVER_PGSERVER_APP_NAME: honua-mcp-cert-${{ github.run_id }}-${{ github.run_attempt }}
        run: node run-inspector.mjs

      - name: Run canonical planning disclosure and hand-authored validation
        id: planning
        if: always() && steps.render-bootstrap.outcome == 'success' && steps.sdk.outcome != 'skipped' && steps.inspector.outcome != 'skipped'
        continue-on-error: true
        working-directory: certification
        env:
          HONUA_MCP_SERVER_SOURCE_SHA: ${{ steps.identity.outputs.source-sha }}
          HONUA_MCP_SERVER_IMAGE: ${{ steps.identity.outputs.image }}
          HONUA_MCP_OWNED_DISPOSABLE_CANDIDATE: "1"
          HONUA_MCP_API_KEY: Ci-Protocol-Api-Key-2026!
        run: node run-planning.mjs

      - name: Cancel an actual Running owned job through both canonical clients
        id: direct-cancel
        if: always() && steps.render-bootstrap.outcome == 'success' && steps.sdk.outcome != 'skipped' && steps.inspector.outcome != 'skipped'
        continue-on-error: true
        working-directory: certification
        env:
          HONUA_MCP_SERVER_SOURCE_SHA: ${{ steps.identity.outputs.source-sha }}
          HONUA_MCP_SERVER_IMAGE: ${{ steps.identity.outputs.image }}
          HONUA_MCP_OWNED_DISPOSABLE_CANDIDATE: "1"
          HONUA_MCP_API_KEY: Ci-Protocol-Api-Key-2026!
        run: node run-direct-cancel.mjs

      - name: Run grounded intent, clarification and declared status with both distributed clients
        id: grounding-status
        if: always() && steps.render-bootstrap.outcome == 'success' && steps.sdk.outcome != 'skipped' && steps.inspector.outcome != 'skipped'
        continue-on-error: true
        working-directory: certification
        env:
          HONUA_MCP_SERVER_SOURCE_SHA: ${{ steps.identity.outputs.source-sha }}
          HONUA_MCP_SERVER_IMAGE: ${{ steps.identity.outputs.image }}
          HONUA_MCP_OWNED_DISPOSABLE_CANDIDATE: "1"
          HONUA_MCP_API_KEY: Ci-Protocol-Api-Key-2026!
          HONUA_CERT_DB_PASSWORD: ${{ env.HONUA_CERT_DB_PASSWORD }}
        run: node run-grounding-status.mjs

      - name: Run canonical ingest publish and persisted restart readback
        id: ingest-publish
        if: always() && steps.render-bootstrap.outcome == 'success' && steps.sdk.outcome != 'skipped' && steps.inspector.outcome != 'skipped'
        continue-on-error: true
        working-directory: certification
        env:
          HONUA_MCP_SERVER_SOURCE_SHA: ${{ steps.identity.outputs.source-sha }}
          HONUA_MCP_SERVER_IMAGE: ${{ steps.identity.outputs.image }}
          HONUA_MCP_OWNED_DISPOSABLE_CANDIDATE: "1"
          HONUA_MCP_API_KEY: Ci-Protocol-Api-Key-2026!
          HONUA_CERT_DB_PASSWORD: ${{ env.HONUA_CERT_DB_PASSWORD }}
        run: node run-ingest-publish.mjs

      - name: Run canonical style application and persisted rendered readback
        id: canonical-style
        if: always() && steps.render-bootstrap.outcome == 'success' && steps.sdk.outcome != 'skipped' && steps.inspector.outcome != 'skipped'
        continue-on-error: true
        working-directory: certification
        env:
          HONUA_MCP_SERVER_SOURCE_SHA: ${{ steps.identity.outputs.source-sha }}
          HONUA_MCP_SERVER_IMAGE: ${{ steps.identity.outputs.image }}
          HONUA_MCP_OWNED_DISPOSABLE_CANDIDATE: "1"
          HONUA_MCP_API_KEY: Ci-Protocol-Api-Key-2026!
          HONUA_CERT_DB_PASSWORD: ${{ env.HONUA_CERT_DB_PASSWORD }}
        run: node run-canonical-styles.mjs

      - name: Run canonical findings and event reads with both distributed clients
        id: ops-events
        if: always() && steps.ops-events-setup.outcome == 'success' && steps.sdk.outcome != 'skipped' && steps.inspector.outcome != 'skipped'
        continue-on-error: true
        working-directory: certification
        env:
          HONUA_MCP_SERVER_SOURCE_SHA: ${{ steps.identity.outputs.source-sha }}
          HONUA_MCP_SERVER_IMAGE: ${{ steps.identity.outputs.image }}
          HONUA_MCP_OWNED_DISPOSABLE_CANDIDATE: "1"
          HONUA_MCP_API_KEY: Ci-Protocol-Api-Key-2026!
          HONUA_CERT_DB_PASSWORD: ${{ env.HONUA_CERT_DB_PASSWORD }}
        run: node run-ops-events.mjs

      - name: Run canonical plan execution replay and durable result readback
        id: execute-plan
        if: always() && steps.render-bootstrap.outcome == 'success' && steps.sdk.outcome != 'skipped' && steps.inspector.outcome != 'skipped'
        continue-on-error: true
        working-directory: certification
        env:
          HONUA_MCP_SERVER_SOURCE_SHA: ${{ steps.identity.outputs.source-sha }}
          HONUA_MCP_SERVER_IMAGE: ${{ steps.identity.outputs.image }}
          HONUA_MCP_OWNED_DISPOSABLE_CANDIDATE: "1"
          HONUA_MCP_API_KEY: Ci-Protocol-Api-Key-2026!
          HONUA_CERT_DB_PASSWORD: ${{ env.HONUA_CERT_DB_PASSWORD }}
        run: node run-execute-plans.mjs

      - name: Run genuine worker result publication and durable fresh readback
        id: publish-result
        if: always() && steps.render-bootstrap.outcome == 'success' && steps.sdk.outcome != 'skipped' && steps.inspector.outcome != 'skipped'
        continue-on-error: true
        working-directory: certification
        env:
          HONUA_MCP_SERVER_SOURCE_SHA: ${{ steps.identity.outputs.source-sha }}
          HONUA_MCP_SERVER_IMAGE: ${{ steps.identity.outputs.image }}
          HONUA_MCP_OWNED_DISPOSABLE_CANDIDATE: "1"
          HONUA_MCP_API_KEY: Ci-Protocol-Api-Key-2026!
          HONUA_CERT_DB_PASSWORD: ${{ env.HONUA_CERT_DB_PASSWORD }}
        run: node run-publish-results.mjs

      - name: Run complete original deployment workspace two-client cohort
        id: deployment-workspace
        if: always() && steps.render-bootstrap.outcome == 'success' && steps.sdk.outcome != 'skipped' && steps.inspector.outcome != 'skipped'
        continue-on-error: true
        working-directory: certification
        env:
          HONUA_MCP_SERVER_SOURCE_SHA: ${{ steps.identity.outputs.source-sha }}
          HONUA_MCP_SERVER_IMAGE: ${{ steps.identity.outputs.image }}
          HONUA_MCP_OWNED_DISPOSABLE_CANDIDATE: "1"
          HONUA_MCP_API_KEY: Ci-Protocol-Api-Key-2026!
          HONUA_CERT_DB_PASSWORD: ${{ env.HONUA_CERT_DB_PASSWORD }}
          HONUA_MCP_TARGET_ID: ${{ inputs.deployment_target_id }}
        run: node run-deployment-workspace.mjs

      - name: Refuse any public geocoder egress
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          # Certification must never send addresses to a public service. The candidate logs every
          # outbound HttpClient request URI; any Nominatim/OpenStreetMap request fails the job.
          if docker logs honua-server 2>&1 | grep -Eiq 'openstreetmap\.org|nominatim\.'; then
            echo '::error::The candidate contacted a public geocoder during certification.'
            exit 1
          fi

      - name: Emit normalized digest-bound fragment
        if: always()
        env:
          EXECUTED_TIER: ${{ steps.identity.outputs.tier }}
          SERVER_SOURCE_SHA: ${{ steps.identity.outputs.source-sha }}
          SERVER_IMAGE: ${{ steps.identity.outputs.image }}
          CUT_AT: ${{ steps.identity.outputs.cut-at }}
          STARTED_AT: ${{ steps.identity.outputs.started-at }}
          RUNTIME_ENVIRONMENT: Production
          HONUA_NIGHTLY_DISPATCH_ID: ${{ inputs.nightly_dispatch_id || '' }}
        shell: bash
        run: |
          mkdir -p artifacts/mcp
          jq -n \
            --arg executedTier "${EXECUTED_TIER}" \
            --arg sourceSha "${SERVER_SOURCE_SHA}" \
            --arg producerSourceSha "${GITHUB_SHA}" \
            --arg imageDigest "${SERVER_IMAGE##*@}" \
            --arg cutAt "${CUT_AT}" \
            --arg startedAt "${STARTED_AT}" \
            --arg runtimeEnvironment "${RUNTIME_ENVIRONMENT}" \
            --arg requestUrl "http://localhost:8080/mcp" \
            --slurpfile sdk certification/artifacts/sdk-results.json \
            --slurpfile inspector certification/artifacts/inspector-results.json \
            '{executedTier:$executedTier,identity:{sourceSha:$sourceSha,producerSourceSha:$producerSourceSha,imageDigest:$imageDigest,cutAt:$cutAt,startedAt:$startedAt,runtimeEnvironment:$runtimeEnvironment,requestUrl:$requestUrl},results:{sdk:$sdk[0],inspector:$inspector[0]}}' \
            > artifacts/mcp/builder-input.json
          node certification/build-fragment.mjs artifacts/mcp/builder-input.json artifacts/mcp/protocol-certification-fragment.json .certification/protocol-certification-requirements.v1.json

      - name: Upload governed producer artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mcp-protocol-certification-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/mcp/protocol-certification-fragment.json
            certification/artifacts/sdk-results.json
            certification/artifacts/inspector-results.json
            certification/artifacts/*.entity-resolution.raw.json
            certification/artifacts/server-harness-source-binding.json
            certification/artifacts/*.plan-validation.raw.json
            certification/artifacts/*.render-validation.raw.json
            certification/artifacts/*.map-package.raw.json
            certification/artifacts/*.ingest-publish.raw.json
            certification/artifacts/*.canonical-style.raw.json
            certification/artifacts/*.canonical-execute-plan.raw.json
            certification/artifacts/*.location-*.raw.json
            certification/artifacts/location-setup-receipt.json
            .certification/location-server-config.json
            certification/artifacts/*.planning.raw.json
            certification/artifacts/*.direct-cancel.raw.json
            certification/artifacts/deployment-workspace-results.json*
            certification/artifacts/*.ops-health.raw.json
            certification/artifacts/*.ops-events.raw.json
            certification/artifacts/*.grounding-status.raw.json
            certification/artifacts/ops-events-setup.json
            certification/artifacts/ops-events-platform-manifest.yaml
            certification/artifacts/ops-events-manifest-binding.json
            certification/artifacts/ops-events-declaration.json
            certification/artifacts/owned-authorization-declaration.json
            certification/artifacts/*.app-package.raw.json
            certification/artifacts/*.canonical-publish-result.raw.json
            certification/artifacts/*.canonical-publish-result.setup.json
            certification/artifacts/*.canonical-style.raw.json.setup.json
            certification/artifacts/*.installed-client-control.json
            certification/artifacts/render-bootstrap.json
            certification/artifacts/redis-durability.json
            certification/artifacts/deployment-prerequisites.json
            certification/.plan-validation/source-binding.json
            certification/.render-validation/source-binding.json
            certification/.app-validation/source-binding.json
            certification/app-validation-pins.json
            certification/render-validation-pins.json
            certification/.location-validation/source-binding.json
            certification/location-validation-pins.json
            certification/.deployment-workspace-validation/source-binding.json
            certification/deployment-workspace-validation-pins.json
            certification/test/fixtures/offline-deployment-workspace-oracle-vector.json
            certification/.planning-validation/source-binding.json
            certification/.direct-cancel-validation/source-binding.json
            certification/direct-cancel-validation-pins.json
            certification/test/fixtures/offline-direct-cancel-oracle-vector.json
            certification/planning-validation-pins.json
            certification/test/fixtures/offline-planning-oracle-vector.json
            certification/.ops-health-validation/source-binding.json
            certification/ops-health-validation-pins.json
            certification/.ops-events-validation/source-binding.json
            certification/ops-events-validation-pins.json
            certification/.grounding-status-validation/source-binding.json
            certification/grounding-status-validation-pins.json
            certification/test/fixtures/offline-app-oracle-vector.json
            certification/test/fixtures/offline-location-oracle-vector.json
            certification/test/fixtures/offline-ops-health-oracle-vector.json
            certification/test/fixtures/offline-ops-events-oracle-vector.json
            certification/test/fixtures/offline-grounding-status-oracle-vector.json
            certification/.render-validation/mcp_fixed_client_manifest.v1.json
            certification/package.json
            certification/package-lock.json
            artifacts/mcp/builder-input.json
            .certification/protocol-certification-requirements.v1.json
            .certification/mcp-operation-auth-policy.v1.json
            .certification/source-binding.json
            .certification/base-schema.sql
            .certification/fixture-row-ids.json
          if-no-files-found: error
          retention-days: 90

      - name: Enforce MCP certification failure semantics
        if: always()
        run: |
          if [[ "${{ steps.deployment-workspace.outcome }}" == "failure" || "${{ steps.cancellation-harness.outcome }}" == "failure" || "${{ steps.render-bootstrap.outcome }}" == "failure" || "${{ steps.sdk.outcome }}" == "failure" || "${{ steps.inspector.outcome }}" == "failure" || "${{ steps.planning.outcome }}" == "failure" || "${{ steps.direct-cancel.outcome }}" == "failure" || "${{ steps.ingest-publish.outcome }}" == "failure" || "${{ steps.canonical-style.outcome }}" == "failure" || "${{ steps.execute-plan.outcome }}" == "failure" || "${{ steps.ops-events-setup.outcome }}" == "failure" || "${{ steps.ops-events.outcome }}" == "failure" || "${{ steps.grounding-status.outcome }}" == "failure" || "${{ steps.publish-result.outcome }}" == "failure" || "${{ steps.location-fixture.outcome }}" != "success" || "${{ steps.location-seed.outcome }}" != "success" ]]; then
            echo "MCP certification runner step(s) failed; downstream workflows must not pass this lane as green."
            exit 1
          fi
