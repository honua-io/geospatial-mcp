name: Attest Spec Index

# Publisher attestations for the published JSON Schema index. Release locks pin
# spec/schemas/index.json at an exact trunk commit, by the sha256 of the bytes
# GitHub serves at https://github.com/honua-io/geospatial-mcp/raw/<commit>/spec/schemas/index.json.
# honua-release's post-gate collector looks up
# repos/honua-io/geospatial-mcp/attestations/sha256:<those bytes> and verifies
# each bundle with --source-digest <pinned commit> --signer-workflow this file,
# so the attestation must come from a run whose github.sha is that commit.
# Every trunk commit that changes the spec, and any trunk commit on dispatch,
# is attested from its own run.

on:
  push:
    branches: [trunk]
    paths:
      - "spec/schemas/**"
      - "tools/spec_sbom.py"
      - ".github/workflows/attest-spec-index.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: attest-spec-index-${{ github.sha }}
  cancel-in-progress: false

jobs:
  attest:
    name: Attest spec/schemas/index.json
    if: github.ref == 'refs/heads/trunk'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Attest only bytes this run verified: the published URL must serve
      # exactly the index in this commit's tree.
      - name: Fetch and verify the published index bytes
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          mkdir -p "${RUNNER_TEMP}/published"
          published="${RUNNER_TEMP}/published/index.json"
          url="https://github.com/${GITHUB_REPOSITORY}/raw/${GITHUB_SHA}/spec/schemas/index.json"
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 -o "${published}" "${url}"
          if ! cmp -s "${published}" spec/schemas/index.json; then
            echo "::error::${url} does not serve this commit's spec/schemas/index.json"
            exit 1
          fi
          echo "PUBLISHED_INDEX=${published}" >> "${GITHUB_ENV}"
          echo "Verified sha256:$(sha256sum "${published}" | cut -d' ' -f1) at ${url}" >> "${GITHUB_STEP_SUMMARY}"

      # No package ecosystem applies to a JSON Schema index (syft catalogs no
      # packages here), so the SBOM lists the index and every schema document it
      # maps, by path and SHA-256. CycloneDX: actions/attest types SPDX as
      # .../Document/v2.3, which the collector does not accept.
      - name: Generate the CycloneDX SBOM
        run: |
          python3 tools/spec_sbom.py \
            --index spec/schemas/index.json \
            --repository "${GITHUB_REPOSITORY}" \
            --revision "${GITHUB_SHA}" \
            --version "${GITHUB_SHA}" \
            --output "${RUNNER_TEMP}/index.cdx.json"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ env.PUBLISHED_INDEX }}

      - name: Attest the SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: ${{ env.PUBLISHED_INDEX }}
          sbom-path: ${{ runner.temp }}/index.cdx.json
